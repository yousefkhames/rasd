<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رصد · Rasd — Anonymous verified incident reports</title>
<meta name="description" content="Rasd: report civic incidents anonymously. Location is blurred, nothing identifies you, and the community verifies what is real.">
<meta name="theme-color" content="#0B1220"><meta name="referrer" content="no-referrer">
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-512.png"><link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="رصد · Rasd"><meta property="og:description" content="Anonymous, community-verified incident reports. No accounts, blurred locations."><meta property="og:image" content="https://yousefkhames.github.io/rasd/og.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<header class="top" role="banner">
  <a class="brand" href="#"><img src="logo.svg" alt="" width="36" height="36"><span><b>رصد</b> <i>Rasd</i></span></a>
  <nav aria-label="Main">
    <button id="btnLang" class="ghost">EN</button>
    <button id="btnTrack" class="ghost" data-i="track"></button>
    <button id="btnReport" class="cta" data-i="report"></button>
  </nav>
</header>

<section class="hero">
  <svg class="radar" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="g" cx="50%" cy="50%"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".25"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="100" r="96" fill="url(#g)"/><g fill="none" stroke="#2DD4BF" stroke-opacity=".35"><circle cx="100" cy="100" r="30"/><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="90"/><path d="M100 10v180M10 100h180"/></g><circle class="ping" cx="100" cy="100" r="8" fill="none" stroke="#FFB020" stroke-width="2"/><circle cx="100" cy="100" r="5" fill="#FFB020"/><circle cx="140" cy="62" r="4" fill="#2DD4BF"/><circle cx="62" cy="128" r="4" fill="#2DD4BF"/><circle cx="126" cy="140" r="3" fill="#FF5C6C"/></svg>
  <h1 data-i="h1"></h1>
  <p data-i="sub"></p>
  <ul class="pillars">
    <li data-i="p1"></li><li data-i="p2"></li><li data-i="p3"></li>
  </ul>
</section>

<p class="emerg" role="note" data-i="emerg"></p>
<main class="layout" id="main" tabindex="-1">
  <aside class="panel">
    <div class="tools"><label class="sr" for="q" data-i="search"></label><input id="q" type="search" data-ph="search"><label class="sr" for="range" data-i="rangeL"></label><select id="range"><option value="0" data-i="rAll"></option><option value="24" data-i="r24"></option><option value="168" data-i="r7"></option><option value="720" data-i="r30"></option></select><label class="sr" for="sort" data-i="sortL"></label><select id="sort"><option value="new" data-i="sNew"></option><option value="conf" data-i="sConf"></option><option value="ver" data-i="sVer"></option></select></div>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <div class="stats" id="stats"></div>
    <div id="list" aria-live="polite"></div>
    <p class="demo" data-i="demo"></p>
  </aside>
  <div id="map" role="region" aria-label="Incident map" tabindex="0"></div>
</main>
<div class="tabs" id="tabs" role="tablist"><button role="tab" id="tabMap" aria-selected="true" data-i="tMap"></button><button role="tab" id="tabList" aria-selected="false" data-i="tList"></button></div>
<button class="fab" id="fab" data-i="reportPlus" aria-label="Report"></button>

<dialog id="dlgReport" aria-labelledby="hReport">
  <form id="frm" method="dialog">
    <h2 id="hReport" data-i="newReport"></h2>
    <label><span data-i="cat"></span><select id="fCat"></select></label>
    <label><span data-i="where"></span>
      <button type="button" class="ghost" id="geo" data-i="geo"></button>
      <div id="pickMap"></div>
      <small data-i="whereHint"></small>
    </label>
    <fieldset class="sev"><legend data-i="sevL"></legend><label><input type="radio" name="sev" value="0"> <span data-i="sev0"></span></label><label><input type="radio" name="sev" value="1" checked> <span data-i="sev1"></span></label><label><input type="radio" name="sev" value="2"> <span data-i="sev2"></span></label></fieldset>
    <label><span data-i="what"></span><textarea id="fText" rows="4" maxlength="500"></textarea>
      <small id="warn" class="warn" role="alert"></small><small id="cnt" class="small"></small></label>
    <label><span data-i="photo"></span><input type="file" id="fPhoto" accept="image/*"><small data-i="photoHint"></small><div id="prev" hidden><img id="prevImg" alt="" width="120"><button type="button" class="ghost" id="prevX" data-i="rm"></button></div></label>
    <p id="fErr" class="warn" role="alert"></p>
    <div class="row"><button type="button" class="ghost" id="cancel" data-i="cancel"></button><button type="submit" class="cta" data-i="submit"></button></div>
  </form>
</dialog>

<dialog id="dlgDone" aria-labelledby="hDone">
  <h2 id="hDone" data-i="sent"></h2>
  <p data-i="codeInfo"></p>
  <div class="code" id="code"></div>
  <p class="small" data-i="codeWarn"></p>
  <button class="cta" id="doneClose" data-i="ok"></button>
</dialog>

<dialog id="dlgTrack" aria-labelledby="hTrack">
  <h2 id="hTrack" data-i="track"></h2>
  <label for="tCode" class="sr" data-i="codeLabel"></label>
  <input id="tCode" autocomplete="off" spellcheck="false" placeholder="RASD-XXXX-XXXX" dir="ltr">
  <div id="tOut" role="status" aria-live="polite"></div>
  <div class="row"><button class="ghost" id="tClose" data-i="close"></button><button class="cta" id="tGo" data-i="check"></button></div>
</dialog>

<section class="how">
  <h2 data-i="howT"></h2>
  <div class="cards" id="how"></div>
</section>
<section class="how" id="insights"><h2 data-i="insT"></h2><div id="bars" class="bars"></div></section>
<section class="how" id="faqS"><h2 data-i="faqT"></h2><div id="faq"></div></section>
<section class="how" id="limitS"><h2 data-i="limT"></h2><ul id="lim" class="lim"></ul></section>
<footer><button class="ghost" id="exp" data-i="exp"></button> <button class="ghost" id="imp" data-i="imp"></button> <input type="file" id="impF" accept="application/json" hidden> <button class="ghost" id="wipe" data-i="wipe"></button><p id="mode" class="small"></p><span data-i="foot"></span> · <a href="https://github.com/yousefkhames/rasd" id="gh" rel="noopener">GitHub</a></footer>
<script src="vendor/leaflet.js" defer></script>
<script src="core.js" defer></script>
<script src="app.js" defer></script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");</script>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
